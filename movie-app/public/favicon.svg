<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer reel circle -->
  <circle cx="32" cy="32" r="30" fill="#030014" stroke="#AB8BFF" stroke-width="2.5"/>
  <!-- Film strip sprocket holes around the edge -->
  <circle cx="32" cy="6"  r="3.5" fill="#AB8BFF"/>
  <circle cx="32" cy="58" r="3.5" fill="#AB8BFF"/>
  <circle cx="6"  cy="32" r="3.5" fill="#AB8BFF"/>
  <circle cx="58" cy="32" r="3.5" fill="#AB8BFF"/>
  <circle cx="13" cy="13" r="3.5" fill="#AB8BFF"/>
  <circle cx="51" cy="51" r="3.5" fill="#AB8BFF"/>
  <circle cx="51" cy="13" r="3.5" fill="#AB8BFF"/>
  <circle cx="13" cy="51" r="3.5" fill="#AB8BFF"/>
  <!-- Inner hub -->
  <circle cx="32" cy="32" r="10" fill="#AB8BFF" opacity="0.15" stroke="#AB8BFF" stroke-width="2"/>
  <circle cx="32" cy="32" r="4"  fill="#AB8BFF"/>
  <!-- Spokes -->
  <line x1="32" y1="22" x2="32" y2="28" stroke="#AB8BFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="36" x2="32" y2="42" stroke="#AB8BFF" stroke-width="2" stroke-linecap="round"/>
