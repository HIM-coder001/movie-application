  <line x1="36" y1="32" x2="42" y2="32" stroke="#AB8BFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="25" y1="25" x2="29" y2="29" stroke="#AB8BFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="35" y1="35" x2="39" y2="39" stroke="#AB8BFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="39" y1="25" x2="35" y2="29" stroke="#AB8BFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="25" y1="39" x2="29" y2="35" stroke="#AB8BFF" stroke-width="2" stroke-linecap="round"/>
